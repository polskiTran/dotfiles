unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind '%'

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# terminal default color mode
set -g default-terminal "tmux-256color"

# ==========================================
# Minimal Kanagawa Tmux Status Bar
# ==========================================

# --- Colors (Kanagawa) ---
# sumiInk1:   #1F1F28 (Base background)
# sumiInk2:   #2A2A37 (Lighter background)
# fujiWhite:  #DCD7BA (Base foreground)
# fujiGray:   #727169 (Muted foreground)
# crystalBlue:#7E9CD8 (Primary accent)
# springGreen:#98BB6C (Secondary accent)
# carpYellow: #E6C384 (Warning/Highlight)

# --- Basic Display ---
# Set base status bar background and foreground
set-option -g status-style bg="#1F1F28",fg="#DCD7BA"

# Put status bar at the top or bottom (change to 'top' if preferred)
set-option -g status-position bottom

# Update status bar every second, comment out will default to 15 sec
set-option -g status-interval 1

# --- Status Left: Session Name ---
set-option -g status-left-length 50
# Uses springGreen for the session name, separated by a clean space
set-option -g status-left "#[bg=#1F1F28,fg=#98BB6C,bold] #S #[bg=#1F1F28,fg=#1F1F28]│"

# --- Status Right: Date & Time ---
set-option -g status-right-length 50
# Displays muted date, followed by bright time
set-option -g status-right "#[bg=#1F1F28,fg=#727169] %Y-%m-%d #[bg=#1F1F28,fg=#DCD7BA] %H:%M "

# --- Window List Design ---
# Center the window list
set-option -g status-justify centre

# Inactive window style: muted background and foreground
set-window-option -g window-status-format "#[bg=#2A2A37,fg=#727169] #I #[bg=#1F1F28,fg=#727169] #W "

# Active window style: crystalBlue background for the number, highlighted text
set-window-option -g window-status-current-format "#[bg=#7E9CD8,fg=#1F1F28,bold] #I #[bg=#2A2A37,fg=#DCD7BA,bold] #W "

# --- Panes and Command Line ---
# Dim inactive pane borders, highlight active one with crystalBlue
# set-option -g pane-border-style fg="#2A2A37"
# set-option -g pane-active-border-style fg="#7E9CD8"

# Command line message styling (carpYellow for high visibility)
set-option -g message-style bg="#2A2A37",fg="#E6C384"
