schemaVersion: "2"
kind: sandbox
name: omp
displayName: Oh My Pi
description: Oh My Pi coding agent

sandbox:
    image: "docker/sandbox-templates:shell-docker"
    entrypoint:
        - xvfb-run
        - --auto-servernum
        - "--server-args=-screen 0 1440x1000x24 -nolisten tcp"
        - omp

permissions:
    network:
        allow:
            # Oh My Pi installation and updates
            - "omp.sh"
            - "api.github.com"
            - "github.com"
            - "raw.githubusercontent.com"
            - "release-assets.githubusercontent.com"

            # Playwright browser downloads
            - "cdn.playwright.dev"
            - "playwright.download.prss.microsoft.com"

            # Package and plugin installation
            - "registry.npmjs.org"
            - "*.npmjs.org"

            # OpenCode Go
            - "opencode.ai"

            # ChatGPT/Codex OAuth
            - "auth.openai.com"
            - "chatgpt.com"

            # Direct OpenAI API models
            - "api.openai.com"

environment:
    variables:
        PLAYWRIGHT_BROWSERS_PATH: /home/agent/.cache/ms-playwright
        PUPPETEER_EXECUTABLE_PATH: /home/agent/.cache/ms-playwright/omp-chromium

setup:
    install:
        - command: "npm install -g pnpm"
          user: "0"
          description: Install pnpm

        - command: >-
              env PLAYWRIGHT_BROWSERS_PATH=/home/agent/.cache/ms-playwright
              npx -y playwright install --with-deps chromium
          user: "1000"
          description: Install ARM64 Playwright Chromium

        - command: >-
              set -eu;
              for candidate in /home/agent/.cache/ms-playwright/chromium-*/chrome-linux/chrome; do
                if [ -x "$candidate" ]; then
                  ln -sfn "$candidate" /home/agent/.cache/ms-playwright/omp-chromium;
                  break;
                fi;
              done;
              test -x /home/agent/.cache/ms-playwright/omp-chromium;
              /home/agent/.cache/ms-playwright/omp-chromium --version
          user: "1000"
          description: Select Chromium for OMP

        - command: >-
              curl -fsSL https://omp.sh/install |
              env PI_INSTALL_DIR=/usr/local/bin sh -s -- --binary
          user: "0"
          description: Install Oh My Pi
