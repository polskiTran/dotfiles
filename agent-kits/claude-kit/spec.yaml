schemaVersion: "2"
kind: mixin
name: claude-dotfiles
displayName: Claude Code Config
description: Claude Code setup

requires:
  agent: claude

permissions:
  network:
    allow:
      - "registry.npmjs.org"
      - "*.npmjs.org"

setup:
  install:
    - command: "npm install -g pnpm"
      user: "0"
      description: Install pnpm

    - command: "npx -y playwright install --with-deps chromium"
      user: "1000"
      description: Install ARM64 Playwright Chromium

    - command: |
        set -e
        bin=$(ls -d /home/agent/.cache/ms-playwright/chromium-*/chrome-linux/chrome | sort -V | tail -1)
        mkdir -p /opt/google/chrome
        ln -sfn "$bin" /opt/google/chrome/chrome
      user: "0"
      description: Point the chrome channel at ARM64 Chromium for Playwright MCP

  startup:
    - command:
        - sh
        - -c
        - |
          i=0
          while [ ! -s /home/agent/settings.json.kit ] && [ $i -lt 30 ]; do
            sleep 1
            i=$((i+1))
          done

          [ -s /home/agent/settings.json.kit ] || exit 0

          mkdir -p /home/agent/.claude
          t=/home/agent/.claude/settings.json

          if [ -s "$t" ]; then
            jq -s '.[0] * .[1]' "$t" /home/agent/settings.json.kit > "$t.tmp" &&
              mv "$t.tmp" "$t"
          else
            cp /home/agent/settings.json.kit "$t"
          fi
      user: "1000"
      description: Apply custom Claude settings
